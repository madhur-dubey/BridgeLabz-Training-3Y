<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="./q6.css">
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b" alt="Ocean">
            <div class="caption">Peaceful Ocean</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8" alt="Sunset">
            <div class="caption">Amazing Sunset</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" alt="Hills">
            <div class="caption">Beautiful Hills</div>
        </div>

    </div>
</body>
</html>
