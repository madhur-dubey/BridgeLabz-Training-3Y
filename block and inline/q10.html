<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

<h1>Select Your Travel Destination</h1>

<label for="country">Country:</label>
<select id="country">
    <option selected>India</option>
    <option>Japan</option>
    <option>France</option>
    <option>UAE</option>
</select>

<br><br>

<label for="state">State:</label>
<select id="state">
    <option selected>Uttar Pradesh</option>
    <option>Delhi</option>
    <option>Maharashtra</option>
    <option>Rajasthan</option>
</select>

<br><br>

<label for="city">City:</label>
<select id="city">
    <option selected>Agra</option>
    <option>Lucknow</option>
    <option>Varanasi</option>
    <option>Jaipur</option>
</select>

<br><br>

<label for="place">Favorite Tourist Place:</label>
<select id="place">
    <option selected>Taj Mahal</option>
    <option>Gateway of India</option>
    <option>Qutub Minar</option>
    <option>Hawa Mahal</option>
</select>

<p>
    My selected destination is India, Uttar Pradesh, Agra, and my
    favorite tourist place is the Taj Mahal.
</p>

</body>
</html>
