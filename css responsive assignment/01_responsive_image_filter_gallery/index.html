<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <!-- Connect this page to its own CSS file. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top">Responsive Image Filter Gallery</a>
      <nav aria-label="Main navigation">
        <a href="#main-content">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="page-content">
    <h1 class="page-title">Responsive Image Filter Gallery</h1>
    
<section class="gallery">
  <figure><img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Mountain landscape"><figcaption>Blur filter</figcaption></figure>
  <figure><img class="grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake and mountains"><figcaption>Grayscale filter</figcaption></figure>
  <figure><img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Sunlight through trees"><figcaption>Sepia filter</figcaption></figure>
  <figure><img class="bright" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700" alt="Lake under blue sky"><figcaption>Brightness filter</figcaption></figure>
  <figure><img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=700" alt="Snowy mountains"><figcaption>Contrast filter</figcaption></figure>
  <figure><img class="hue" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=700" alt="Deer in a forest"><figcaption>Hue rotate filter</figcaption></figure>
</section>

  </main>
  <footer id="contact" class="site-footer">
    <p>Beginner CSS Practice · Contact: hello@example.com</p>
  </footer>
</body>
</html>
