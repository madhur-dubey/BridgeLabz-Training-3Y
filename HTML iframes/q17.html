<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form
        action="data:text/html,<h1>Form successfully submitted.</h1>"
        target="resultFrame">

        <label>Enter your name:</label>
        <input type="text" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
