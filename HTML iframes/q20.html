<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage for search engines -->
    <meta name="description" content="Example webpage demonstrating important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Rishi">

    <!-- Sets the title displayed in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Used to add CSS to the webpage -->
    <style>
    </style>

    <!-- Used to add JavaScript to the webpage -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This page demonstrates important elements used inside the HTML head.
    </p>

</body>

</html>
