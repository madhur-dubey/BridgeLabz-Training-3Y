<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login</h1>

    <form>
        <!-- CSRF token helps protect the form from Cross-Site Request Forgery attacks. -->
        <input type="hidden" name="csrf_token" value="dummy12345">

        <label>Username:</label>
        <input type="text" name="username">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <input type="submit" value="Login">
    </form>

</body>
</html>
