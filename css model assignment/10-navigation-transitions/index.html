<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Transitions</title>
  <link rel="stylesheet" href="navigation.css">
</head>
<body>
  <header><h1>Bright Ideas</h1><p>A simple responsive navigation bar</p></header>
  <nav aria-label="Main navigation">
    <a class="active" href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>
  <main id="home">
    <section><h2>Welcome</h2><p>This page demonstrates a horizontal navigation bar that becomes vertical on smaller screens.</p></section>
    <section id="about"><h2>About</h2><p>Use the links to practice hover and active styles.</p></section>
  </main>
  <footer id="contact"><p>Made for CSS practice · hello@example.com</p></footer>
</body>
</html>
