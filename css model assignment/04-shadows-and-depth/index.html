<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth</title>
  <link rel="stylesheet" href="shadows.css">
</head>
<body>
  <header><h1>Shadows and Depth</h1><p>Hover over a card to lift it.</p></header>
  <main class="cards">
    <article class="card soft"><h2>Soft Shadow</h2><p>A gentle shadow gives this card a light, floating look.</p></article>
    <article class="card strong"><h2>Strong Shadow</h2><p>A stronger shadow makes the card stand out.</p></article>
    <article class="card colored"><h2>Colored Shadow</h2><p>A colored shadow adds personality to the design.</p></article>
  </main>
  <footer><p>Use shadows to create visual depth.</p></footer>
</body>
</html>
