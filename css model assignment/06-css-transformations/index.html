<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="transformations.css">
</head>
<body>
  <header><h1>CSS Transformations</h1><p>Hover over each box to see its transformation.</p></header>
  <main class="transform-list">
    <figure><div class="shape rotate">Rotate</div><figcaption>rotate(12deg)</figcaption></figure>
    <figure><div class="shape scale">Scale</div><figcaption>scale(1.15)</figcaption></figure>
    <figure><div class="shape translate">Move</div><figcaption>translate(10px, -8px)</figcaption></figure>
    <figure><div class="shape skew">Skew</div><figcaption>skew(8deg)</figcaption></figure>
  </main>
  <footer><p>Transitions make transformations smooth.</p></footer>
</body>
</html>
