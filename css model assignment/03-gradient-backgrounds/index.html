<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="gradients.css">
</head>
<body>
  <header><h1>CSS Gradients</h1></header>
  <main>
    <section class="gradient linear"><h2>Linear Gradient</h2><p>Colors blend from one side to another.</p></section>
    <section class="gradient radial"><h2>Radial Gradient</h2><p>Colors spread outward from a central point.</p></section>
    <section class="extra"><h2>Fixed Background Effect</h2><p>The linear section uses background-attachment: fixed for a parallax-like effect on supported browsers.</p></section>
  </main>
  <footer><p>Gradient practice page</p></footer>
</body>
</html>
