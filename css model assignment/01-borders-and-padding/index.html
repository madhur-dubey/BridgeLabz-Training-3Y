<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="borders-padding.css">
</head>
<body>
  <header><h1>Borders and Padding</h1><p>Small examples of CSS borders, corners, and spacing.</p></header>
  <main class="box-row">
    <section class="demo solid"><h2>Solid</h2><p>Padding: 12px</p></section>
    <section class="demo dashed"><h2>Dashed</h2><p>Padding: 20px</p></section>
    <section class="demo double"><h2>Double</h2><p>Padding: 28px</p></section>
    <section class="demo groove"><h2>Groove</h2><p>Rounded corners</p></section>
  </main>
  <footer><p>Hover over a box to change its border color.</p></footer>
</body>
</html>
