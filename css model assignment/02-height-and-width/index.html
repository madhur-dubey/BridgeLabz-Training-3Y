<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="height-width.css">
</head>
<body>
  <header><h1>Height and Width Practice</h1><p>Compare common CSS sizing units.</p></header>
  <main class="size-area">
    <section class="size-box pixel"><h2>Pixels</h2><p>Width: 180px</p><p>Height: 130px</p></section>
    <section class="size-box percent"><h2>Percent</h2><p>Width: 80%</p><p>Max width: 420px</p></section>
    <section class="size-box viewport"><h2>Viewport</h2><p>Minimum height: 18vh</p><p>Text stays inside with overflow rules.</p></section>
  </main>
  <footer><p>Resize the browser to see the layout adapt.</p></footer>
</body>
</html>
