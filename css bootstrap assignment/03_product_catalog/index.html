<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared responsive navigation -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="#">Product Catalog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#main-content">Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact-footer">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <main id="main-content">
    
<section class="container py-5">
  <h1 class="text-center mb-4">Our Products</h1>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://placehold.co/400x250?text=Headphones" class="card-img-top" alt="Headphones"><div class="card-body"><h2 class="h5">Headphones</h2><p>₹1,499</p><a href="#" class="btn btn-primary">Add to Cart</a></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://placehold.co/400x250?text=Watch" class="card-img-top" alt="Watch"><div class="card-body"><h2 class="h5">Smart Watch</h2><p>₹2,999</p><a href="#" class="btn btn-primary">Add to Cart</a></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://placehold.co/400x250?text=Backpack" class="card-img-top" alt="Backpack"><div class="card-body"><h2 class="h5">Backpack</h2><p>₹999</p><a href="#" class="btn btn-primary">Add to Cart</a></div></article></div>
    <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://placehold.co/400x250?text=Speaker" class="card-img-top" alt="Speaker"><div class="card-body"><h2 class="h5">Speaker</h2><p>₹1,899</p><a href="#" class="btn btn-primary">Add to Cart</a></div></article></div>
  </div>
</section>

  </main>
  <footer id="contact-footer" class="site-footer">
    <p class="mb-1">Product Catalog</p>
    <small>Find something you’ll love. | Contact: hello@example.com</small>
  </footer>
  <!-- Bootstrap bundle enables the navbar and carousel controls -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
