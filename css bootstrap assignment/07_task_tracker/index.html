<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared responsive navigation -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="#">Task Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#main-content">Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact-footer">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <main id="main-content">
    
<section class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><h1>My Tasks</h1><span class="badge text-bg-primary fs-6">3 pending</span></div>
  <div class="list-group">
    <div class="list-group-item d-flex justify-content-between align-items-center"><span>Finish assignment</span><span class="badge text-bg-danger">High</span></div>
    <div class="list-group-item d-flex justify-content-between align-items-center"><span>Review class notes</span><span class="badge text-bg-warning">Medium</span></div>
    <div class="list-group-item d-flex justify-content-between align-items-center"><span>Organise study desk</span><span class="badge text-bg-success">Low</span></div>
  </div>
  <button type="button" class="btn btn-success mt-4">Completed <span class="badge text-bg-light">1</span></button>
</section>

  </main>
  <footer id="contact-footer" class="site-footer">
    <p class="mb-1">Task Tracker</p>
    <small>Keep your work organised. | Contact: hello@example.com</small>
  </footer>
  <!-- Bootstrap bundle enables the navbar and carousel controls -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
