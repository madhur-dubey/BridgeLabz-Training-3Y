<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared responsive navigation -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="#">Personal Portfolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#main-content">Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact-footer">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <main id="main-content">
    
<section class="container py-5 text-center">
  <div class="profile-box bg-light p-5 rounded">
    <img class="profile-img img-fluid rounded-circle mb-3" src="https://placehold.co/180x180" alt="Profile placeholder">
    <h1 class="fw-bold">Your Name</h1>
    <p class="lead">Student | Web Development Learner</p>
    <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
    <a href="#" class="btn btn-outline-dark">Download CV</a>
  </div>
  <section id="contact" class="mt-5">
    <h2>Contact Me</h2>
    <form class="contact-form mx-auto">
      <input class="form-control mb-3" type="text" placeholder="Your name" aria-label="Your name">
      <input class="form-control mb-3" type="email" placeholder="Your email" aria-label="Your email">
      <button class="btn btn-primary" type="button">Send Message</button>
    </form>
  </section>
</section>

  </main>
  <footer id="contact-footer" class="site-footer">
    <p class="mb-1">Personal Portfolio</p>
    <small>Student | Web Development Learner | Contact: hello@example.com</small>
  </footer>
  <!-- Bootstrap bundle enables the navbar and carousel controls -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
