<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="css_tooltips.css">
</head>
<body>
<header><h1>CSS Tooltip Demonstration</h1><p>Hover over each item to see a helpful note.</p></header>
<main class="tooltip-area">
  <div class="tip-item"><button type="button">Save</button><span class="tooltip">Save your changes</span></div>
  <div class="tip-item"><span class="word">HTML</span><span class="tooltip">Builds the page structure</span></div>
  <div class="tip-item"><span class="word">CSS</span><span class="tooltip">Styles the page</span></div>
  <div class="tip-item"><span class="word">Grid</span><span class="tooltip">Creates rows and columns</span></div>
  <div class="tip-item"><span class="word">Flexbox</span><span class="tooltip">Aligns items in a flexible row or column</span></div>
</main>
<footer><p>Tooltips are made with CSS only.</p></footer>
</body>
</html>
