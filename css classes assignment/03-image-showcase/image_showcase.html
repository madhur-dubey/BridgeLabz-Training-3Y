<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image_showcase.css">
</head>
<body>
<header><h1>Image Showcase</h1><p>A responsive collection of beautiful places.</p></header>
<main class="gallery">
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean beach"></div><figcaption>Ocean Breeze</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80" alt="Blue waves"></div><figcaption>Blue Waves</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake and mountains"></div><figcaption>Quiet Lake</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight through forest"></div><figcaption>Green Forest</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Snowy mountain peaks"></div><figcaption>Snowy Peaks</figcaption></figure>
</main>
<footer><p>Move your pointer over a photo to explore the effect.</p></footer>
</body>
</html>
