<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="css_animations.css">
</head>
<body>
<header><h1>CSS Animation Demonstration</h1><p>Three animations created with CSS keyframes.</p></header>
<main class="animation-stage">
  <section class="animation-item"><div class="moving-box"></div><h2>Moving box</h2><p>Slides from side to side.</p></section>
  <section class="animation-item"><div class="ball"></div><h2>Bouncing ball</h2><p>Repeats forever with a delay.</p></section>
  <section class="animation-item"><div class="color-word">Hello!</div><h2>Color-changing text</h2><p>Alternates colors and direction.</p></section>
</main>
<footer><p>Animations use @keyframes and ease-in-out.</p></footer>
</body>
</html>
