<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <link rel="stylesheet" href="ui_components.css">
</head>
<body>
<header><h1>UI Components</h1><p>A simple search and actions panel.</p></header>
<main class="component-card">
  <label for="site-search">Search the website</label>
  <div class="search-row"><input id="site-search" type="search" placeholder="Search topics..."><button type="button">Search</button></div>
  <div class="action-row"><button class="secondary" type="button">Cancel</button><button type="button">Save changes</button></div>
  <label for="topic">Choose a topic</label>
  <select id="topic"><option>Select a topic</option><option>HTML basics</option><option>CSS layout</option><option>Responsive design</option></select>
  <p class="help-text">These controls demonstrate focus and hover styling. The form is a visual example.</p>
</main>
<footer><p>Built with HTML and CSS only.</p></footer>
</body>
</html>
