<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="styled_buttons.css">
</head>
<body>
<header><h1>Styled Button Collection</h1><p>Hover, click, or focus a button to see its state.</p></header>
<main class="button-card">
  <button class="btn primary" type="button">Primary</button>
  <button class="btn secondary" type="button">Secondary</button>
  <button class="btn outline" type="button">Outline</button>
  <button class="btn disabled" type="button" disabled>Disabled</button>
  <p>Use Tab to move focus between enabled buttons.</p>
</main>
<footer><p>Button styles made with basic CSS.</p></footer>
</body>
</html>
