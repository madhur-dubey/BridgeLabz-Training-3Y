<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface Layout</title>
  <link rel="stylesheet" href="mini_ui_layout.css">
</head>
<body>
<header class="site-header"><h1>BrightPath</h1><p>Simple tools for your next step</p></header>
<main class="main-area">
  <section class="main-card">
    <div class="intro">
      <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=500&q=80" alt="Bright modern workspace">
      <div><h2>Join our community</h2><p>Get practical tips and updates delivered to your inbox.</p></div>
    </div>
    <form action="#" method="get">
      <label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Enter your name">
      <label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com">
      <div class="form-buttons"><button type="submit">Join now</button><button class="cancel" type="reset">Clear</button></div>
    </form>
  </section>
</main>
<footer><p>© 2026 BrightPath • Made with HTML and CSS</p></footer>
</body>
</html>
